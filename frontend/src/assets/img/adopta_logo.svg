    <!-- Dedo central izquierdo -->
    <ellipse cx="38.5" cy="27.5" rx="9" ry="14" transform="rotate(-6 38.5 27.5)" />
    <!-- Dedo central derecho -->
    <ellipse cx="59.5" cy="27.5" rx="9" ry="14" transform="rotate(6 59.5 27.5)" />
    <!-- Dedo exterior derecho -->
    <ellipse cx="75.5" cy="48" rx="8.2" ry="12.5" transform="rotate(18 75.5 48)" />

