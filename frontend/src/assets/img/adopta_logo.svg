             C 27.5 86.5, 35.5 87.5, 41 84 
             C 44.5 81.8, 46.5 80.8, 49 80.8 
             C 51.5 80.8, 53.5 81.8, 57 84 
             C 62.5 87.5, 70.5 86.5, 73 80.5 
             C 76 73.5, 71.5 68.5, 68.5 60.5 
             C 65.5 52, 59.5 44.5, 49 44.5 Z" />
  </g>

