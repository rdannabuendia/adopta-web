  <text x="95" y="79" fill="#64999D" font-family="&#39;Segoe UI&#39;, &#39;Roboto&#39;, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-weight="700" font-size="67" letter-spacing="-1.2">Adopta</text>

  <!-- Símbolo "+" geométrico para máxima fidelidad -->
  <g fill="#64999D">
    <!-- Barra vertical -->
